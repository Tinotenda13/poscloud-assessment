<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSCloud - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #fff; border-radius: 8px; padding: 2rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
        .brand { font-size: 1.4rem; font-weight: bold; color: #3498db; margin-bottom: 1.5rem; text-align: center; }
        label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 1rem; font-size: 0.9rem; }
        button { width: 100%; padding: 0.6rem; background: #3498db; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 0.95rem; }
        button:hover { opacity: 0.85; }
        .alert { padding: 0.75rem 1rem; border-radius: 5px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">POSCloud</div>
        {% if message %}
        <div class="alert alert-{{ message_type }}">{{ message }}</div>
        {% endif %}
        <form method="post" action="/login">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
